name: Build Silver UWP (Xbox Dev Mode)

on:
  push:
    branches: [ claude/build-silver ]
  workflow_dispatch:

env:
  rgbds_version: v1.0.4
  # Pinned libretro/gambatte-libretro commit (GPLv2 Game Boy Color core).
  gambatte_ref: 77f2567d718b8973d02caa2daa8dce4953faf811

jobs:
  rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rgbds
        uses: actions/checkout@v4
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Build pokesilver.gbc
        run: |
          rm -rf rgbds
          make -j$(nproc) pokesilver.gbc
          echo "49b163f7e57702bc939d642a18f591de55d92dae  pokesilver.gbc" | sha1sum -c -

      - uses: actions/upload-artifact@v4
        with:
          name: pokesilver-rom
          path: pokesilver.gbc
          if-no-files-found: error

  uwp:
    needs: rom
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout gambatte-libretro
        uses: actions/checkout@v4
        with:
          repository: libretro/gambatte-libretro
          ref: ${{ env.gambatte_ref }}
          path: uwp/gambatte

      - uses: actions/download-artifact@v4
        with:
          name: pokesilver-rom
          path: uwp/rom

      - name: Create self-signed package certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=PokeSilverUWP" `
            -KeyUsage DigitalSignature -FriendlyName "PokeSilverUWP" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "pokesilver" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath uwp\PokeSilver.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath uwp\PokeSilver.cer | Out-Null

      - name: Configure
        shell: pwsh
        run: cmake -S uwp -B uwp/build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_SYSTEM_NAME=WindowsStore" "-DCMAKE_SYSTEM_VERSION=10.0"

      - name: Build and package
        shell: pwsh
        run: |
          $out = Join-Path $PWD "uwp\out\"
          $pfx = Join-Path $PWD "uwp\PokeSilver.pfx"
          cmake --build uwp/build --config Release --target PokeSilver -- `
            /m /v:minimal `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$pfx" `
            /p:PackageCertificatePassword=pokesilver `
            /p:AppxPackageDir="$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item uwp\PokeSilver.cer uwp\out\
          Get-ChildItem -Recurse uwp\out | Select-Object FullName, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: pokesilver-uwp-x64
          path: uwp/out/
          if-no-files-found: error
